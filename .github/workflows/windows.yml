name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - run: python -m unittest discover -s tests
      - run: python -m PyInstaller --noconfirm TrendyolFGO.spec
      - shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/TrendyolFGO/TrendyolFGO.exe -ArgumentList '--data-dir', '.qa/smoke', '--smoke-test' -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Smoke test failed' }
          Copy-Item README.md, GHID.md, ACCES_RAPOARTE_FGO.md dist/TrendyolFGO/
          Compress-Archive -Path dist/TrendyolFGO -DestinationPath SellerIntegrator-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SellerIntegrator-Windows
          path: SellerIntegrator-Windows.zip
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SellerIntegrator-Windows
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" SellerIntegrator-Windows.zip --title "SellerIntegrator $RELEASE_TAG" --generate-notes
